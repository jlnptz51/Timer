  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #000;
    color: #fff;
    font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    text-align: center;
  }

  /* ---------- Inhalt (liegt über der Deko) ---------- */
  main {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(1.4rem, 4vw, 2.5rem);
  }
  .kopfzeile { display: flex; flex-direction: column; align-items: center; gap: .1rem; }
  h1 {
    font-family: "Great Vibes", cursive;
    font-size: clamp(2.6rem, 11vw, 4.8rem);
    font-weight: 400;
    line-height: 1.05;
    color: #ffd9e2;
    text-shadow: 0 0 20px rgba(255, 140, 170, .6), 0 0 3px rgba(0, 0, 0, .7);
  }
  .datum {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(1rem, 3vw, 1.3rem);
    letter-spacing: .22em;
    color: #ebc6cf;
    text-shadow: 0 0 6px #000;
  }
  .timer {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: clamp(1rem, 3vw, 2.5rem);
  }
  .unit { min-width: 5.5rem; }
  .unit[hidden] { display: none; }
  /* Fortschrittsringe um die Zahlen */
  .ring { --d: clamp(84px, 24vw, 120px); position: relative; width: var(--d); aspect-ratio: 1; margin: 0 auto; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring .spur { fill: none; stroke: rgba(255, 220, 225, .16); stroke-width: 4.5; }
  .ring .fort {
    fill: none; stroke: url(#ringgrad); stroke-width: 4.5; stroke-linecap: round;
    stroke-dasharray: 213.63; stroke-dashoffset: 213.63;
    transition: stroke-dashoffset .6s ease;
    filter: drop-shadow(0 0 4px rgba(240, 160, 170, .8));
  }
  .num {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: "Cormorant Garamond", Georgia, serif;
    font-size: calc(var(--d) * .46);
    font-weight: 700;
    line-height: 1;
    color: #ffeed8;
    text-shadow: 0 0 3px rgba(0, 0, 0, .7), 0 0 14px rgba(255, 170, 190, .55);
    font-variant-numeric: lining-nums tabular-nums;
  }
  @media (min-width: 760px) {
    .ring { --d: clamp(92px, 11vw, 128px); }
    .timer { flex-wrap: nowrap; }
  }
  @media (prefers-reduced-motion: reduce) { .ring .fort { transition: none; } }
  .label {
    display: block;
    margin-top: .4rem;
    font-family: "Cormorant Garamond", Georgia, serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(1rem, 2.6vw, 1.2rem);
    letter-spacing: .03em;
    color: #ebc6cf;
    text-shadow: 0 0 6px #000, 0 0 10px #000;
  }
  .spruch {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(1.2rem, 4.8vw, 1.8rem);
    line-height: 1.3;
    color: #ffdcc6;
    text-shadow: 0 0 8px #000, 0 0 16px rgba(0, 0, 0, .7);
    text-wrap: balance;
  }
  .total { font-family: "Cormorant Garamond", Georgia, serif; font-style: italic; font-weight: 500; font-size: clamp(.95rem, 2.4vw, 1.15rem); color: #ebc6cf; opacity: .75; text-shadow: 0 0 6px #000; }

  /* Überraschung am Jahrestag */
  .jahrestag {
    font-family: "Great Vibes", cursive;
    font-size: clamp(1.35rem, 6vw, 3.2rem);
    white-space: nowrap;
    font-weight: 400;
    color: #ffe6c8;
    text-shadow: 0 0 18px rgba(255, 120, 170, .8), 0 0 3px rgba(0, 0, 0, .7);
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    animation: pulse 1s ease-in-out infinite alternate;
  }
  @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.06); } }

  /* ---------- Ebenen im Hintergrund ---------- */
  #petals, #stars, #deko, #rain, #fx {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
  }
  #petals, #stars, #deko, #rain { z-index: 0; }
  #fx { z-index: 5; }

  /* Fallende Rosenblätter */
  .blatt { position: absolute; top: 0; left: var(--x); animation: fallen var(--t) linear infinite; animation-delay: var(--d); }
  .blatt i {
    display: block; width: var(--s); height: calc(var(--s) * 1.3); border-radius: 150% 0 150% 0;
    background: linear-gradient(135deg, #ffc9d6, #e0587f); opacity: .8;
    animation: wiegen 2.6s ease-in-out infinite alternate;
  }
  @keyframes fallen {
    from { transform: translate3d(0, -30px, 0) rotate(0deg); }
    to   { transform: translate3d(var(--dx), calc(var(--h) + 40px), 0) rotate(var(--rot)); }
  }
  @keyframes wiegen { from { transform: translateX(-12px) rotateY(0deg); } to { transform: translateX(12px) rotateY(70deg); } }

  /* Funkeln */
  .star {
    position: absolute;
    line-height: 1;
    opacity: .2;
    animation: twinkle var(--tw) ease-in-out infinite alternate;
    animation-delay: var(--td);
  }
  @keyframes twinkle {
    from { opacity: .12; transform: scale(.7); }
    to   { opacity: .95; transform: scale(1.15); }
  }

  /* Schwebende Herzen, Blumen und Eheringe */
  .item {
    position: absolute;
    left: var(--x);
    top: var(--y);
    font-size: clamp(1.6rem, 4.5vw, 3rem);
    line-height: 1;
    opacity: .9;
    will-change: transform;
    pointer-events: auto;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    animation: sway var(--t1) ease-in-out infinite alternate;
    animation-delay: var(--d1);
  }
  .item .inner {
    display: block;
    animation: bob var(--t2) ease-in-out infinite alternate;
    animation-delay: var(--d2);
  }
  .item .face { display: block; }
  .item .face.pop  { animation: pop .35s ease-out forwards; }
  .item .face.back { animation: back .6s ease-out; }
  .item.ring { width: clamp(3rem, 9vw, 5.5rem); }
  .item.ring .inner { filter: drop-shadow(0 0 6px rgba(255, 200, 80, .45)); }
  .item.ring svg { display: block; width: 100%; height: auto; }
  #deko.faint .item { opacity: .3; }

  /* vor und zurück */
  @keyframes sway {
    from { transform: translateX(calc(var(--dx) * -1)); }
    to   { transform: translateX(var(--dx)); }
  }
  /* leichtes Auf und Ab mit Drehung */
  @keyframes bob {
    from { transform: translateY(-1.8vh) rotate(-12deg); }
    to   { transform: translateY(1.8vh)  rotate(12deg); }
  }
  /* Platzen beim Antippen */
  @keyframes pop  { to { transform: scale(1.9); opacity: 0; } }
  @keyframes back { from { transform: scale(.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  /* Kurze Bildschirme: Inhalt etwas kompakter, damit oben und unten Platz für die Deko bleibt */
  @media (max-height: 780px) and (min-width: 760px) {
    h1 { font-size: clamp(2.4rem, 7vh, 3.6rem); }
    main { gap: 1.4rem; }
    .jahrestag { font-size: clamp(1.6rem, 5vh, 2.4rem); }
  }
  @media (max-height: 500px) {
    h1 { font-size: 2.2rem; }
    main { gap: .8rem; }
    .ring { --d: 66px; }
    .spruch { font-size: 1.05rem; }
    .jahrestag { font-size: 1.5rem; }
  }

  /* Partikel (Konfetti, Herzregen, Funken) */
  .fx { position: absolute; left: 0; top: 0; line-height: 1; pointer-events: none; will-change: transform; }

  @media (prefers-reduced-motion: reduce) {
    .item, .item .inner, .star, .jahrestag, #foto, .blatt, .blatt i { animation: none; }
    .star { opacity: .5; }
  }

<body>

  <!-- Vorlage für die Eheringe -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="64" y2="40">
        <stop offset="0" stop-color="#fff0b3"/>
        <stop offset=".5" stop-color="#e3aa2f"/>
        <stop offset="1" stop-color="#a16f14"/>
      </linearGradient>
      <linearGradient id="ringgrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="80" y2="80">
        <stop offset="0" stop-color="#f7d9a6"/>
        <stop offset="1" stop-color="#e58aa8"/>
      </linearGradient>
      <symbol id="rings" viewBox="0 0 64 40">
        <circle cx="22" cy="20" r="14" fill="none" stroke="url(#gold)" stroke-width="5"/>
        <circle cx="42" cy="20" r="14" fill="none" stroke="url(#gold)" stroke-width="5"/>
        <path d="M29 7.88A14 14 0 0 1 34.12 13" fill="none" stroke="url(#gold)" stroke-width="5"/>
      </symbol>
    </defs>
  </svg>

  <div id="foto" aria-hidden="true"></div>
  <div id="schleier" aria-hidden="true"></div>
  <div id="petals" aria-hidden="true"></div>
  <div id="stars" aria-hidden="true"></div>
  <div id="deko" aria-hidden="true"></div>
  <div id="rain" aria-hidden="true"></div>
  <div id="fx" aria-hidden="true"></div>

  <main>
    <!-- erscheint nur am Jahrestag -->
    <div class="jahrestag" id="jahrestag" role="button" hidden></div>

    <div class="kopfzeile">
      <h1 id="titel"></h1>
      <p class="datum" id="untertitel"></p>
    </div>

    <div class="timer">
      <!-- Jahre: erst sichtbar, wenn 1 Jahr erreicht ist -->
      <div class="unit" id="unitY" hidden><div class="ring" data-ring="y"><svg viewBox="0 0 80 80" aria-hidden="true"><circle class="spur" cx="40" cy="40" r="34"/><circle class="fort" cx="40" cy="40" r="34"/></svg><span class="num" id="y">0</span></div><span class="label">Jahre</span></div>
      <div class="unit"><div class="ring" data-ring="mo"><svg viewBox="0 0 80 80" aria-hidden="true"><circle class="spur" cx="40" cy="40" r="34"/><circle class="fort" cx="40" cy="40" r="34"/></svg><span class="num" id="mo">0</span></div><span class="label">Monate</span></div>
      <div class="unit"><div class="ring" data-ring="d"><svg viewBox="0 0 80 80" aria-hidden="true"><circle class="spur" cx="40" cy="40" r="34"/><circle class="fort" cx="40" cy="40" r="34"/></svg><span class="num" id="d">0</span></div><span class="label">Tage</span></div>
      <div class="unit"><div class="ring" data-ring="h"><svg viewBox="0 0 80 80" aria-hidden="true"><circle class="spur" cx="40" cy="40" r="34"/><circle class="fort" cx="40" cy="40" r="34"/></svg><span class="num" id="h">00</span></div><span class="label">Stunden</span></div>
      <div class="unit"><div class="ring" data-ring="mi"><svg viewBox="0 0 80 80" aria-hidden="true"><circle class="spur" cx="40" cy="40" r="34"/><circle class="fort" cx="40" cy="40" r="34"/></svg><span class="num" id="mi">00</span></div><span class="label">Minuten</span></div>
      <div class="unit"><div class="ring" data-ring="s"><svg viewBox="0 0 80 80" aria-hidden="true"><circle class="spur" cx="40" cy="40" r="34"/><circle class="fort" cx="40" cy="40" r="34"/></svg><span class="num" id="s">00</span></div><span class="label">Sekunden</span></div>
    </div>

    <p class="spruch" id="spruch" hidden></p>
    <p class="total" id="total"></p>
  </main>

<script>
  // =====================================================
  //  EINSTELLUNGEN – hier kannst du Texte und Datum ändern
  // =====================================================
  // Titel ganz oben (Schreibschrift), z. B. "Julian & Name"
  const TITEL = "Unser Ja-Wort";
  // Zeile unter dem Titel
  const UNTERTITEL = "25. Juli 2026";
  // Startzeitpunkt: 25.07.2026, 00:00 Uhr (Monat zählt ab 0: Juli = 6)
  const START = new Date(2026, 6, 25, 0, 0, 0);

  // ---------- Hilfsfunktionen ----------
  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, "0");
  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const reduce = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);

  $("titel").textContent = TITEL;
  $("untertitel").textContent = UNTERTITEL;

  // ---------- Timer ----------
  const EINHEITEN = [
    ["Jahr", "Jahren"], ["Monat", "Monaten"], ["Tag", "Tagen"],
    ["Stunde", "Stunden"], ["Minute", "Minuten"], ["Sekunde", "Sekunden"]
  ];

  // "Vor 3 Monaten und 13 Tagen haben wir Ja gesagt" (die zwei größten Einheiten)
  function spruchText(werte) {
    const teile = [];
    werte.forEach((n, i) => {
      if (n > 0 && teile.length < 2) teile.push(n + " " + EINHEITEN[i][n === 1 ? 0 : 1]);
    });
    return teile.length ? "Vor " + teile.join(" und ") + " haben wir Ja gesagt" : "";
  }

  let letzterSpruch = null;
  function setSpruch(text) {
    if (text === letzterSpruch) return;
    letzterSpruch = text;
    $("spruch").textContent = text;
    $("spruch").hidden = !text;
  }

  function tick() {
    const now = new Date();
    if (now < START) {
      // Falls das Datum noch in der Zukunft liegt: Countdown-Anzeige
      const diff = START - now;
      setAll(0, 0, Math.floor(diff / 864e5), Math.floor(diff / 36e5) % 24,
             Math.floor(diff / 6e4) % 60, Math.floor(diff / 1e3) % 60);
      setSpruch("");
      $("total").textContent = "Noch nicht gestartet – es läuft rückwärts bis zum 25.07.2026";
      return;
    }
    let y = now.getFullYear() - START.getFullYear();
    let mo = now.getMonth() - START.getMonth();
    let d = now.getDate() - START.getDate();
    let h = now.getHours() - START.getHours();
    let mi = now.getMinutes() - START.getMinutes();
    let s = now.getSeconds() - START.getSeconds();

    if (s < 0) { s += 60; mi--; }
    if (mi < 0) { mi += 60; h--; }
    if (h < 0) { h += 24; d--; }
    if (d < 0) {
      d += new Date(now.getFullYear(), now.getMonth(), 0).getDate();
      mo--;
    }
    if (mo < 0) { mo += 12; y--; }

    setAll(y, mo, d, h, mi, s);
    setSpruch(spruchText([y, mo, d, h, mi, s]));
    const totalDays = Math.floor((now - START) / 864e5);
    $("total").textContent = "Insgesamt " + totalDays.toLocaleString("de-DE") + " Tage";
  }

  function setAll(y, mo, d, h, mi, s) {
    // Zahl und Wort „Jahre" erscheinen erst ab 1 Jahr
    const hideY = y < 1;
    if ($("unitY").hidden !== hideY) {
      $("unitY").hidden = hideY;
      if (window.buildDeko) window.buildDeko();   // Layout hat sich geändert
    }
    $("y").textContent = y;
    $("mo").textContent = mo;
    $("d").textContent = d;
    $("h").textContent = pad(h);
    $("mi").textContent = pad(mi);
    $("s").textContent = pad(s);
    setRings(y, mo, d, h, mi, s);
  }

  // Ringe: zeigen, wie weit die jeweilige Einheit schon ist
  const ringVorher = {};
  function setRings(y, mo, d, h, mi, s) {
    const frac = {
      s: s / 60, mi: (mi + s / 60) / 60, h: (h + mi / 60) / 24,
      d: d / 30, mo: (mo + d / 30) / 12, y: (mo + d / 30) / 12
    };
    document.querySelectorAll("[data-ring]").forEach(r => {
      const k = r.dataset.ring, c = r.querySelector(".fort");
      const f = Math.min(1, frac[k]);
      const umbruch = ringVorher[k] !== undefined && f < ringVorher[k];
      if (umbruch) c.style.transition = "none";          // beim Neustart nicht rückwärts laufen
      c.style.strokeDashoffset = 213.63 * (1 - f);
      if (umbruch) { void c.getBoundingClientRect(); c.style.transition = ""; }
      ringVorher[k] = f;
    });
  }

  tick();
  setInterval(tick, 1000);

  // ---------- Funkelnde Sterne ----------
  function buildPetals() {
    const layer = $("petals");
    layer.innerHTML = "";
    layer.style.setProperty("--h", window.innerHeight + "px");
    const n = window.innerWidth < 600 ? 9 : 14;
    for (let i = 0; i < n; i++) {
      const b = document.createElement("span");
      b.className = "blatt";
      b.style.setProperty("--x", rnd(0, 96) + "%");
      b.style.setProperty("--s", rnd(10, 18) + "px");
      b.style.setProperty("--t", rnd(10, 18) + "s");
      b.style.setProperty("--d", (-rnd(0, 18)) + "s");
      b.style.setProperty("--dx", rnd(-60, 60) + "px");
      b.style.setProperty("--rot", rnd(180, 540) + "deg");
      b.innerHTML = "<i></i>";
      layer.appendChild(b);
    }
  }

  function buildStars() {
    const layer = $("stars");
    layer.innerHTML = "";
    const box = document.querySelector("main").getBoundingClientRect();
    const W = window.innerWidth, Hh = window.innerHeight;
    const farben = ["#ffffff", "#ffe9c4", "#ffc2d6", "#ffd9a8"];
    const n = window.innerWidth < 600 ? 45 : 80;
    for (let i = 0; i < n; i++) {
      const el = document.createElement("span");
      el.className = "star";
      const c = pick(farben);
      // Sterne nicht hinter den Text setzen
      let px, py, versuche = 0;
      do {
        px = rnd(0, 100); py = rnd(0, 100); versuche++;
      } while (versuche < 12 &&
               px / 100 * W > box.left - 12 && px / 100 * W < box.right + 12 &&
               py / 100 * Hh > box.top - 12 && py / 100 * Hh < box.bottom + 12);
      el.style.left = px + "%";
      el.style.top = py + "%";
      el.style.setProperty("--tw", rnd(1.5, 4.5) + "s");
      el.style.setProperty("--td", (-rnd(0, 5)) + "s");
      if (i % 7 === 0) {                       // größere Sterne
        el.textContent = "✦";
        el.style.fontSize = rnd(10, 18) + "px";
        el.style.color = c;
        el.style.textShadow = "0 0 8px " + c;
      } else {                                  // kleine Lichtpunkte
        const s = rnd(1.5, 3.5);
        el.style.width = el.style.height = s + "px";
        el.style.background = c;
        el.style.boxShadow = "0 0 6px " + c;
        el.style.borderRadius = "50%";
      }
      layer.appendChild(el);
    }
  }

  // ---------- Effekte: Funken, Konfetti, Herzregen ----------
  const fxLayer = $("fx"), rainLayer = $("rain");

  // Kleiner Herzregen, wenn man ein Herz, eine Blume oder die Ringe antippt
  const BURST = {
    heart:  ["❤️", "💖", "💕", "✨"],
    flower: ["🌸", "🌼", "💗", "✨"],
    ring:   ["💍", "✨", "⭐", "✨"]
  };
  function burst(x, y, kind) {
    if (reduce) return;
    const set = BURST[kind] || BURST.heart;
    for (let i = 0; i < 10; i++) {
      const el = document.createElement("span");
      el.className = "fx";
      el.textContent = pick(set);
      el.style.fontSize = rnd(14, 26) + "px";
      el.style.left = x + "px";
      el.style.top = y + "px";
      fxLayer.appendChild(el);
      const ang = rnd(0, Math.PI * 2), dist = rnd(30, 90);
      const dx = Math.cos(ang) * dist, dy = Math.sin(ang) * dist - 30;
      el.animate([
        { transform: "translate(-50%,-50%) translate(0,0) scale(.6)", opacity: 1 },
        { transform: `translate(-50%,-50%) translate(${dx}px,${dy}px) scale(1)`, opacity: 1, offset: .4 },
        { transform: `translate(-50%,-50%) translate(${dx * 1.3}px,${dy + rnd(90, 160)}px) scale(.8)`, opacity: 0 }
      ], { duration: rnd(900, 1500), easing: "ease-out", fill: "forwards" }).onfinish = () => el.remove();
    }
  }

  // Konfetti-Explosion
  function confetti(cx, cy) {
    if (reduce) return;
    const x0 = cx === undefined ? window.innerWidth / 2 : cx;
    const y0 = cy === undefined ? window.innerHeight * 0.3 : cy;
    const farben = ["#ffd6df", "#f7d9a6", "#e58aa8", "#ffffff", "#ffb3c7", "#e0587f"];
    for (let i = 0; i < 90; i++) {
      const el = document.createElement("span");
      el.className = "fx";
      const w = rnd(6, 11);
      el.style.width = w + "px";
      el.style.height = w * rnd(1, 1.8) + "px";
      el.style.background = pick(farben);
      if (Math.random() < .3) el.style.borderRadius = "50%";
      el.style.left = x0 + "px";
      el.style.top = y0 + "px";
      fxLayer.appendChild(el);
      const ang = rnd(-Math.PI, 0), v = rnd(80, 320);      // nach oben und außen
      const dx = Math.cos(ang) * v, dy = Math.sin(ang) * v;
      const rot = rnd(-720, 720);
      el.animate([
        { transform: "translate(0,0) rotate(0deg)", opacity: 1 },
        { transform: `translate(${dx}px,${dy}px) rotate(${rot / 2}deg)`, opacity: 1, offset: .35 },
        { transform: `translate(${dx * 1.4}px,${dy + window.innerHeight * .8}px) rotate(${rot}deg)`, opacity: 0 }
      ], { duration: rnd(1800, 3200), easing: "ease-out", fill: "forwards" }).onfinish = () => el.remove();
    }
  }

  // Herzregen: fallende Herzen, Blumen und Eheringe
  const REGEN = ["❤️", "💖", "💕", "🌸", "🌹", "🌷", "ring", "ring"];
  function rain() {
    if (document.hidden || reduce) return;
    const art = pick(REGEN);
    const el = document.createElement("span");
    el.className = "fx";
    el.style.opacity = ".8";
    if (art === "ring") {
      el.style.width = rnd(34, 56) + "px";
      el.innerHTML = '<svg viewBox="0 0 64 40" style="display:block;width:100%;height:auto"><use href="#rings"/></svg>';
    } else {
      el.textContent = art;
      el.style.fontSize = rnd(20, 36) + "px";
    }
    el.style.left = rnd(0, Math.max(10, window.innerWidth - 50)) + "px";
    rainLayer.appendChild(el);
    const drift = rnd(-60, 60);
    el.animate([
      { transform: `translate(0,-60px) rotate(${rnd(-20, 20)}deg)` },
      { transform: `translate(${drift}px,${window.innerHeight + 80}px) rotate(${rnd(-90, 90)}deg)` }
    ], { duration: rnd(5000, 9000), easing: "linear", fill: "forwards" }).onfinish = () => el.remove();
  }

  // ---------- Überraschung am Jahrestag (25.07. jedes Jahr) ----------
  // Vorschau zum Ausprobieren: Adresse mit ?jahrestag am Ende öffnen (oder ?jahrestag=3)
  function jahrestag() {
    const p = new URLSearchParams(window.location.search);
    if (p.has("jahrestag")) return parseInt(p.get("jahrestag"), 10) || 1;
    const now = new Date();
    const n = now.getFullYear() - START.getFullYear();
    if (n >= 1 && now.getMonth() === START.getMonth() && now.getDate() === START.getDate()) return n;
    return 0;
  }

  const JT = jahrestag();
  if (JT) {
    const b = $("jahrestag");
    b.textContent = "💍 Heute ist unser " + JT + ". Jahrestag! 💍";
    b.hidden = false;
    b.addEventListener("pointerdown", () => {
      const r = b.getBoundingClientRect();
      confetti(r.left + r.width / 2, r.top + r.height / 2);
    });
    if (!reduce) {
      setTimeout(() => confetti(), 500);
      setInterval(rain, 450);
    }
  }

  // ---------- Schwebende Deko: Herzen, Blumen, Eheringe ----------
  window.buildDeko = function () {
    const deko = $("deko");
    deko.innerHTML = "";
    const hearts  = ["❤️", "💕", "💖", "💗", "💓"];
    const flowers = ["🌸", "🌹", "🌷", "🌼", "💐", "🌺"];

    const items = [];
    const small = window.innerWidth < 600;
    for (let i = 0; i < (small ? 6 : 8); i++) items.push({ kind: "heart",  c: hearts[i % hearts.length] });
    for (let i = 0; i < (small ? 5 : 7); i++) items.push({ kind: "flower", c: flowers[i % flowers.length] });
    for (let i = 0; i < (small ? 4 : 5); i++) items.push({ kind: "ring" });

    // mischen
    for (let i = items.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [items[i], items[j]] = [items[j], items[i]];
    }

    let N = items.length;

    // Freie Bereiche über und unter dem Timer suchen, damit nichts den Text verdeckt
    const H = window.innerHeight;
    const box = document.querySelector("main").getBoundingClientRect();
    const zones = [];
    const topEnd   = (box.top - 66) / H * 100;
    const botStart = (box.bottom + 24) / H * 100;
    const botEnd   = (H - 66) / H * 100;
    if (topEnd - 2 >= 4)         zones.push({ a: 2,        len: topEnd - 2 });
    if (botEnd - botStart >= 4)  zones.push({ a: botStart, len: botEnd - botStart });
    let total = zones.reduce((s, z) => s + z.len, 0);
    deko.classList.remove("faint");
    if (total < 8) {              // zu wenig Platz (z. B. Handy quer): überall, aber blass
      zones.length = 0;
      zones.push({ a: 2, len: 86 });
      total = 86;
      deko.classList.add("faint");
    }
    const pickY = s => {
      let t = s * total;
      for (const z of zones) { if (t < z.len) return z.a + t; t -= z.len; }
      const last = zones[zones.length - 1];
      return last.a + last.len;
    };

    // Wenig Platz? Dann weniger Elemente, damit es nicht gedrängt aussieht
    N = deko.classList.contains("faint") ? 8
      : Math.max(6, Math.min(items.length, Math.round(items.length * Math.min(1, total / 30))));
    items.length = N;
    const perm = items.map((_, i) => i);
    for (let i = perm.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [perm[i], perm[j]] = [perm[j], perm[i]];
    }

    items.forEach((it, i) => {
      const dx = rnd(8, 18);          // wie weit es nach links/rechts schwingt (vw)
      const t1 = rnd(6, 12);          // Dauer vor und zurück (s)
      const t2 = rnd(3, 6);           // Dauer Auf und Ab (s)
      const fx = (i + Math.random() * 0.8) / N;
      const y  = pickY((perm[i] + Math.random() * 0.8) / N);

      const el = document.createElement("span");
      el.className = "item" + (it.kind === "ring" ? " ring" : "");
      el.dataset.kind = it.kind;
      el.style.setProperty("--x", (dx + fx * (100 - 2 * dx - 10)) + "%");
      el.style.setProperty("--y", y + "%");
      el.style.setProperty("--dx", dx + "vw");
      el.style.setProperty("--t1", t1 + "s");
      el.style.setProperty("--t2", t2 + "s");
      el.style.setProperty("--d1", (-rnd(0, t1 * 2)) + "s");
      el.style.setProperty("--d2", (-rnd(0, t2 * 2)) + "s");

      const inner = document.createElement("span");
      inner.className = "inner";
      const face = document.createElement("span");
      face.className = "face";
      if (it.kind === "ring") {
        face.innerHTML = '<svg viewBox="0 0 64 40"><use href="#rings"/></svg>';
      } else {
        face.textContent = it.c;
      }
      inner.appendChild(face);
      el.appendChild(inner);
      deko.appendChild(el);
    });
  };

  // Antippen: platzt mit kleinem Herzregen und kommt nach kurzer Zeit wieder
  $("deko").addEventListener("pointerdown", e => {
    const item = e.target.closest(".item");
    if (!item) return;
    const face = item.querySelector(".face");
    if (face.classList.contains("pop")) return;
    const r = face.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2, item.dataset.kind);
    face.classList.add("pop");
    setTimeout(() => {
      face.classList.remove("pop");
      face.classList.add("back");
      setTimeout(() => face.classList.remove("back"), 700);
    }, 1800);
  });

  buildDeko();
  buildStars();
  buildPetals();
  let lw = window.innerWidth, lh = window.innerHeight, rt;
  window.addEventListener("resize", () => {
    clearTimeout(rt);
    rt = setTimeout(() => {
      // Nur neu aufbauen, wenn sich die Fenstergröße wirklich ändert (nicht bei der Adressleiste am Handy)
      if (window.innerWidth !== lw || Math.abs(window.innerHeight - lh) / lh > 0.15) {
        lw = window.innerWidth; lh = window.innerHeight;
        buildDeko();
        buildStars();
        buildPetals();
      }
    }, 250);
  });
</script>
</body>
</html>
